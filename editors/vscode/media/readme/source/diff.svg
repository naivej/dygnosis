<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" role="img" aria-labelledby="title description" fill="none" stroke-linecap="round" stroke-linejoin="round"><title id="title">Structural model Diff</title><desc id="description">Illustration of the engine's paired parameter and equation changes, native filters and verified source actions.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="716" rx="0" fill="#ffffff" stroke="none"/><rect x="16" y="16" width="1168" height="664" rx="10" fill="white" stroke="#bbc5d2"/><rect x="16" y="16" width="1168" height="42" rx="10" fill="#223047" stroke="none"/><rect x="16" y="46" width="1168" height="12" rx="0" fill="#223047" stroke="none"/><text x="38" y="44" font-size="20" fill="#f7f9fd" font-weight="600">Visual Studio Code</text><text x="995" y="43" font-size="21" fill="#f7f9fd" font-weight="400">−    □    ×</text><rect x="16" y="58" width="1168" height="42" rx="0" fill="#eef1f6" stroke="none"/><text x="38" y="86" font-size="20" fill="#223047" font-weight="600">Dygnosis model Diff</text><path d="M16 100L1184 100" stroke="#d4dae3" stroke-width="1"/><rect x="16" y="650" width="1168" height="30" rx="0" fill="#0861b5" stroke="none"/><text x="34" y="672" font-size="17" fill="white" font-weight="400">Dygnosis</text><text x="1077" y="672" font-size="17" fill="white" font-weight="400">Dynare</text><text x="1058" y="705" font-size="16" fill="#627084" font-weight="400">Illustration</text><text x="42" y="140" font-size="29" fill="#223047" font-weight="600">Model Diff</text><text x="42" y="177" font-size="20" fill="#223047" font-weight="400">Before (active model): model.mod</text><text x="42" y="210" font-size="20" fill="#223047" font-weight="400">After (selected model): stoch.mod</text><rect x="1016" y="118" width="130" height="37" rx="4" fill="#0861b5" stroke="#0861b5"/><text x="1028" y="143" font-size="19" fill="white" font-weight="400">Refresh</text><text x="42" y="258" font-size="18" fill="#223047