<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" role="img" aria-labelledby="title description" fill="none" stroke-linecap="round" stroke-linejoin="round"><title id="title">Effective-model source and macro origins</title><desc id="description">Illustration of a read-only expanded equation jumping to its exact written include, with a distinct macro iteration origin.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="716" rx="0" fill="#ffffff" stroke="none"/><rect x="16" y="16" width="1168" height="664" rx="10" fill="white" stroke="#bbc5d2"/><rect x="16" y="16" width="1168" height="42" rx="10" fill="#223047" stroke="none"/><rect x="16" y="46" width="1168" height="12" rx="0" fill="#223047" stroke="none"/><text x="38" y="44" font-size="20" fill="#f7f9fd" font-weight="600">Visual Studio Code</text><text x="995" y="43" font-size="21" fill="#f7f9fd" font-weight="400">−    □    ×</text><rect x="16" y="58" width="1168" height="42" rx="0" fill="#eef1f6" stroke="none"/><text x="38" y="86" font-size="20" fill="#223047" font-weight="600">model.mod · effective preview</text><text x="650" y="86" font-size="20" fill="#223047" font-weight="600">equations.inc · written source</text><path d="M16 100L1184 100" stroke="#d4dae3" stroke-width="1"/><rect x="16" y="650" width="1168" height="30" rx="0" fill="#0861b5" stroke="none"/><text x="34" y="672" font-size="17" fill="white" font-weight="400">Dygnosis</text><text x="1077" y="672" font-size="17" fill="white" font-weight="400">Dynare</text><text x="1058" y="705" font-size="16" fill="#627084" font-weight="400">Illustration</text><rect x="17" y="101" width="581" height="549" rx="0" fill="#f8fafc" stroke="none"/><path d="M598 100L598 650" stroke="#d4dae3" stroke-width="1"/><text x="42" y="141" font-size="24" fill="#223047" font-weight="600">Read-only effective model</text><text x="43" y="190" font-size="26" fill="#164eb5" font-weight="400" font-family="Consolas, monospace">var y1 y2;</text><text x="43" y="234" font-size="26" fill="#164eb5" font-weight="400" font-family="Consolas, monospace">model;</text><text x="43" y="278" font-size="26" fill="#223047" font-weight="400" font-family="Consolas, monospace">  y1 = 0;</text><rect x="30" y="296" width="549" height="46" rx="0" fill="#dceafb" stroke="none"/><text x="43" y="326" font-size="26" fill="#223047" font-weight="400" font-family="Consolas, monospace">  y2 = 0;</text><text x="43" y="370" font-size="26" fill="#164eb5" font-weight="400" font-family="Consolas, monospace">end;</text><rect x="42" y="405" width="488" height="123" rx="5" fill="white" stroke="#bbc5d2"/><rect x="43" y="406" width="486" height="41" rx="4" fill="#0861b5" stroke="none"/><text x="58" y="435" font-size="21" fill="white" font-weight="400">Go to written source</text><text x="58" y="475" font-size="21" fill="#223047" font-weight="400">Show macro origins</text><text x="58" y="514" font-size="21" fill="#223047" font-weight="400">Refresh</text><text x="43" y="567" font-size="21" fill="#52657d" font-weight="400">Trace the selected expanded equation</text><text x="43" y="602" font-size="21" fill="#52657d" font-weight="400">to the file you edit.</text><text x="624" y="141" font-size="24" fill="#223047" font-weight="600">Written include</text><text x="624" y="197" font-size="26" fill="#865313" font-weight="400" font-family="Consolas, monospace">@#for i in [1,2]</text><rect x="613" y="218" width="552" height="46" rx="0" fill="#dceafb" stroke="none"/><text x="624" y="248" font-size="26" fill="#223047" font-weight="400" font-family="Consolas, monospace">y@{i} = 0;</text><text x="624" y="300" font-size="26" fill="#865313" font-weight="400" font-family="Consolas, monospace">@#endfor</text><rect x="618" y="379" width="547" height="158" rx="5" fill="white" stroke="#82acd8"/><text x="638" y="413" font-size="22" fill="#223047" font-weight="600">Choose a verified macro origin</text><path d="M619 430L1164 430" stroke="#d4dae3" stroke-width="1"/><text x="638" y="463" font-size="22" fill="#0861b5" font-weight="600">for · i=2 · directive</text><text x="638" y="505" font-size="20" fill="#52657d" font-weight="400">equations.inc:1</text><text x="625" y="592" font-size="21" fill="#52657d" font-weight="400">Repeated copies retain their own origins.</text></g></svg>