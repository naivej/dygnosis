name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Branch or commit to verify as an unpublished candidate
        required: true
        type: string
      candidate:
        description: Build candidate artifacts without a release tag
        default: true
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: vMAJOR.MINOR.PATCH tag to build and launch
        required: true
        type: string
      candidate:
        default: false
        type: boolean

# Cross-platform compatibility for the Rust engine and the VS Code extension.
# Format, Clippy, the TypeScript client checks, and publication stay local.

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, runner: windows-2022, rust: x86_64-pc-windows-msvc, arch: x64 }
          - { target: win32-arm64, runner: windows-11-arm, rust: aarch64-pc-windows-msvc, arch: arm64 }
          - { target: darwin-x64, runner: macos-15-intel, rust: x86_64-apple-darwin, arch: x64 }
          - { target: darwin-arm64, runner: macos-15, rust: aarch64-apple-darwin, arch: arm64 }
          - { target: linux-x64, runner: ubuntu-22.04, rust: x86_64-unknown-linux-gnu, arch: x64 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm, rust: aarch64-unknown-linux-gnu, arch: arm64 }
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.rust }}

      - name: Test the engine
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2 libgbm1 libgtk-3-0 libnss3

      - name: Package and launch the extension
        working-directory: editors/vscode
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          npm ci --ignore-scripts
          if [ "$CANDIDATE" = true ]; then
            npm run package:target -- --target "$TARGET" --candidate
          else
            npm run package:target -- --target "$TARGET" --tag "$RELEASE_TAG"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "bin/dygnosis" > "dist/$TARGET/runtime-libraries.txt"
            readelf --version-info "bin/dygnosis" >> "dist/$TARGET/runtime-libraries.txt"
            ldd --version >> "dist/$TARGET/runtime-libraries.txt"
            xvfb-run -a npm run verify:package -- --target "$TARGET" --vscode 1.102.0
            xvfb-run -a npm run verify:package -- --target "$TARGET" --vscode stable
          elif [ "$RUNNER_OS" = macOS ]; then
            otool -L "bin/dygnosis" > "dist/$TARGET/runtime-libraries.txt"
            otool -l "bin/dygnosis" >> "dist/$TARGET/runtime-libraries.txt"
            npm run verify:package -- --target "$TARGET" --vscode 1.102.0
            npm run verify:package -- --target "$TARGET" --vscode stable
          else
            powershell -NoProfile -Command 'Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,OSArchitecture | Format-List' > "dist/$TARGET/runtime-libraries.txt"
            npm run verify:package -- --target "$TARGET" --vscode 1.102.0
            npm run verify:package -- --target "$TARGET" --vscode stable
          fi

      - name: Upload exact tested packages and evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          retention-days: 30
          if-no-files-found: error
          path: |
            editors/vscode/dist/${{ matrix.target }}/*.vsix
            editors/vscode/dist/${{ matrix.target }}/*.tar.gz
            editors/vscode/dist/${{ matrix.target }}/*.json
            editors/vscode/dist/${{ matrix.target }}/*.txt

      - name: Upload installed host logs after success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-logs-${{ matrix.target }}
          retention-days: 7
          include-hidden-files: true
          path: editors/vscode/.test-data/**/host-evidence/**

  verified:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: win32-x64
          path: verified-packages/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: win32-arm64
          path: verified-packages/win32-arm64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-x64
          path: verified-packages/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: verified-packages/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: verified-packages/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: verified-packages/linux-arm64
      - name: Verify complete matrix and immutable package checksums
        run: node editors/vscode/scripts/collect-artifacts.cjs --directory verified-packages
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          retention-days: 30
          if-no-files-found: error
          path: verified-packages
