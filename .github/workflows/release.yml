# Cross-platform compatibility for a version tag, then a GitHub Release of the
# tested standalone bundles and VSIX files. Marketplace publication is marketplace.yml.
#
# Usage:
#   git tag v0.12.0
#   git push origin v0.12.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Require a version tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'if (!/^v\d+\.\d+\.\d+$/.test(process.env.TAG)) throw new Error("Expected a vMAJOR.MINOR.PATCH tag")'

  compatibility:
    needs: tag
    name: Compatibility
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    needs: compatibility
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract release notes
        shell: bash
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            /^##[[:space:]]+/ {
              if (found) exit
              title = $0
              sub(/^##[[:space:]]+/, "", title)
              sub(/[[:space:]].*$/, "", title)
              if (title == tag) found = 1
              next
            }
            found { print }
            END {
              if (!found) {
                print "No changelog entry for " tag > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Changelog entry is empty for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test release asset staging
        run: node --test editors/vscode/tests/release_staging.test.cjs

      - name: Stage verified standalone bundles and VSIX files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/stage-release.cjs --directory artifacts --output release --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
