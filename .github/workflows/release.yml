# Create a GitHub Release when a version tag is pushed.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          NOTES="$(mktemp)"
          # Take the ## $TAG section from CHANGELOG.md (until the next ## heading).
          awk -v tag="$TAG" '
            $0 == "## " tag { keep=1; next }
            keep && /^## / { exit }
            keep { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::No ## $TAG section in CHANGELOG.md"
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES"
