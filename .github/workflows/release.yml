# Legacy Rust notes releases through v0.11.0. Later tags build and verify packages;
# publication uses the separate, manually dispatched Extension publication job.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-22.04
    outputs:
      legacy: ${{ steps.version.outputs.legacy }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("node:fs"); const m=/^v(\d+)\.(\d+)\.(\d+)$/.exec(process.env.TAG); if(!m) throw new Error("Expected a vMAJOR.MINOR.PATCH tag"); const [major,minor,patch]=m.slice(1).map(Number); const legacy=major===0 && (minor<11 || (minor===11 && patch===0)); fs.appendFileSync(process.env.GITHUB_OUTPUT,`legacy=${legacy}\n`);'

  release:
    needs: route
    if: needs.route.outputs.legacy == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          NOTES="$(mktemp)"
          # Take the ## $TAG section from CHANGELOG.md (until the next ## heading).
          awk -v tag="$TAG" '
            $0 == "## " tag { keep=1; next }
            keep && /^## / { exit }
            keep { print }
          ' CHANGELOG.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::No ## $TAG section in CHANGELOG.md"
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES"

  extension-artifacts:
    needs: route
    if: needs.route.outputs.legacy == 'false'
    uses: ./.github/workflows/extension-build.yml
    with:
      release_tag: ${{ github.ref_name }}
