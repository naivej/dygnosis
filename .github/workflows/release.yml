# Cross-platform compatibility for a version tag, then a GitHub Release of the
# tested engine binaries and VSIX files. Marketplace publication is marketplace.yml.
#
# Usage:
#   git tag v0.12.0
#   git push origin v0.12.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Require a version tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'if (!/^v\d+\.\d+\.\d+$/.test(process.env.TAG)) throw new Error("Expected a vMAJOR.MINOR.PATCH tag")'

  compatibility:
    needs: tag
    name: Compatibility
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    needs: compatibility
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract release notes
        shell: bash
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            /^##[[:space:]]+/ {
              if (found) exit
              title = $0
              sub(/^##[[:space:]]+/, "", title)
              sub(/[[:space:]].*$/, "", title)
              if (title == tag) found = 1
              next
            }
            found { print }
            END {
              if (!found) {
                print "No changelog entry for " tag > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Changelog entry is empty for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: artifacts

      - name: Stage tested engine binaries and VSIX files
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            target="$(basename "$dir")"
            archive="$(find "$dir" -name '*.tar.gz' -print -quit)"
            test -n "$archive"
            member="$(tar -tzf "$archive" | grep -E '/dygnosis(\.exe)?$')"
            case "$target" in
              win32-*) name="dygnosis-${target}.exe" ;;
              *) name="dygnosis-${target}" ;;
            esac
            tar -xOf "$archive" "$member" > "release/$name"
            case "$target" in
              win32-*) ;;
              *) chmod 755 "release/$name" ;;
            esac
            vsix="$(find "$dir" -maxdepth 1 -type f -name 'dygnosis-*.vsix')"
            test "$(printf '%s\n' "$vsix" | grep -c .)" -eq 1
            cp "$vsix" "release/$(basename "$vsix")"
          done
          test "$(find release -type f -name '*.vsix' | wc -l)" -eq 6
          test "$(find release -type f ! -name '*.vsix' ! -name SHA256SUMS | wc -l)" -eq 6
          (cd release && sha256sum dygnosis-* > SHA256SUMS)
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
