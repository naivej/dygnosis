[package]
name = "dygnosis"
description = "Dynare analysis core"
# Product version source. After editing, run: node scripts/version.cjs --sync
version = "0.11.35"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/naivej/dygnosis"
exclude = ["editors/**"]

[[bin]]
name = "dygnosis"
path = "src/main.rs"

[dependencies]
# Musl libm, pure Rust. Used for `tgamma` / `lgamma` / `erf` / `erfc` so those
# builtins are not local series. https://github.com/rust-lang/libm
libm = "0.2.16"
clap = { version = "4", features = ["derive"] }
regex = "1"
rmcp = { version = "3.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time"] }
tower-lsp = "0.20"
tower = { version = "0.4", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Line numbers for backtraces. Full symbols made each test program about 270 MB.
# Incremental compilation stays on (the dev default).
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# Full symbols for a debugger: cargo test --profile debugging
# Output goes to target/debugging/ and leaves target/debug/ unchanged.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
codegen-units = 1
lto = true
