[package]
name = "dygnosis"
description = "Dynare analysis core — LSP and MCP for .mod files"
# Product version source. After editing, run: node scripts/version.cjs --sync
version = "0.11.14"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/naivej/dygnosis"
exclude = ["editors/**"]

[[bin]]
name = "dygnosis"
path = "src/main.rs"

[dependencies]
# Musl libm, pure Rust. Used for `tgamma` / `lgamma` / `erf` / `erfc` so those
# builtins are not local series. https://github.com/rust-lang/libm
libm = "0.2.16"
clap = { version = "4", features = ["derive"] }
regex = "1"
rmcp = { version = "3.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net"] }
tower-lsp = "0.20"
tower = { version = "0.4", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
